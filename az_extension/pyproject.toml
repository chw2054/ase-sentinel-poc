[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-cli-ase"
version = "0.1.0"
description = "Diff, deploy, and read Sentinel incidents and the WAF block list."

[tool.setuptools.packages.find]
include = ["azext_ase*"]

[tool.setuptools.package-data]
azext_ase = ["azext_metadata.json"]
