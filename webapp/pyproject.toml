[project]
name = "ase-sentinel-ops"
version = "1.0.0"
description = "Web App control plane for the ASE Sentinel WAF block proof of concept"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "gunicorn>=23.0",
  "sqlalchemy>=2.1",
  "mssql-python>=1.16",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
