{% extends "base.html" %}
{% block body %}
<h1>Audit log</h1>
<table>
  <tr><th>When</th><th>Actor</th><th>Action</th><th>Target</th><th>Detail</th></tr>
  {% for row in rows %}
  <tr>
    <td>{{ row.created_at }}</td>
    <td>{{ row.actor }}</td>
    <td>{{ row.action }}</td>
    <td>{{ row.target }}</td>
    <td>{{ row.detail }}</td>
  </tr>
  {% else %}
  <tr><td colspan="5">No audit rows.</td></tr>
  {% endfor %}
</table>
{% endblock %}
