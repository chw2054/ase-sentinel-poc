{% extends "base.html" %}
{% block body %}
<h1>Approvals</h1>
<form method="get">
  <select name="state">
    <option value="">All</option>
    {% for item in ["pending", "approved", "rejected", "executed", "execution_failed", "canceled", "expired"] %}
    <option {% if state == item %}selected{% endif %}>{{ item }}</option>
    {% endfor %}
  </select>
  <button>Filter</button>
</form>
<table>
  <tr><th>State</th><th>Proposed</th><th>Reviewer</th></tr>
  {% for row in rows %}
  <tr>
    <td><a href="/approvals/{{ row.id }}">{{ row.state }}</a></td>
    <td>{{ row.proposed }}</td>
    <td>{{ row.reviewer }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
